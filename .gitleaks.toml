# Gitleaks configuration.
#
# Detection rules come from the pinned scanner's upstream default rule
# set, loaded through the [extend] section below. A supplied config
# REPLACES the default rules unless it extends them — the cycle-210
# version of this file carried an allowlist and nothing else, so the
# configured scan ran with zero rules and could not find anything
# (audit finding RR-01, repaired in W1). Whether the rules are really
# loaded is proven, not asserted: tests/test_gitleaks_sensitivity.py
# plants a never-issued canary in a disposable directory and a
# disposable git history and requires the exact CI invocation
# (gitleaks detect --redact --config .gitleaks.toml, gitleaks 8.30.1)
# to detect it in both modes, with a benign control staying clean.
[extend]
useDefault = true

# NO allowlist. Owner order, 2026-11-11: no exceptions — a finding is
# either solved or left standing open, never excepted away.
#
# Standing open findings (enumerated, not excepted): the full-history
# scan reports exactly two findings, both verified-synthetic test
# fixtures invented before W1 that persist in immutable git history:
#
# 1. 'ARBITRARY-TEXT-leak-1' — the arbitrary-error-text fixture from
#    tests/test_cycle79_evaluate_engine_audit.py (backend error text
#    must never survive into a report).
# 2. 'probe-value-hunter2-leakprobe' — the _PROBE_SECRET constant from
#    tests/test_cycle55_evaluate_audit.py (probe text a fake backend
#    raises with; observations must never carry it).
#
# Both strings were replaced at source in W1 with
# non-credential-shaped equivalents, so neither occurs in the current
# tree and a working-tree scan is clean with no exceptions. They
# remain in pre-W1 commits; removing them from the record would
# require a history rewrite, which the owner has not ordered. Until
# then the history scan stays red on exactly these two findings —
# visible in every CI secret-scan run — by the owner's explicit
# decision. Any FURTHER finding is a genuine triage item.
