# Gitleaks configuration.
#
# Detection rules come from the pinned scanner's upstream default rule
# set, loaded through the [extend] section below. A supplied config
# REPLACES the default rules unless it extends them — the cycle-210
# version of this file carried an allowlist and nothing else, so the
# configured scan ran with zero rules and could not find anything
# (audit finding RR-01, repaired in W1). Whether the rules are really
# loaded is proven, not asserted: tests/test_gitleaks_sensitivity.py
# plants a never-issued canary in a disposable directory and a
# disposable git history and requires the exact CI invocation
# (gitleaks detect --redact --config .gitleaks.toml, gitleaks 8.30.1)
# to detect it in both modes, with a benign control staying clean.
[extend]
useDefault = true

# NO allowlist. Owner order, 2026-11-11: no exceptions — a finding is
# either solved or left standing open, never excepted away.
#
# The two historical findings this file once enumerated are closed
# by removal, not exception. Both were verified-synthetic test
# fixtures invented before W1: the arbitrary-error-text fixture in
# tests/test_cycle79_evaluate_engine_audit.py (backend error text
# must never survive into a report) and the probe constant in
# tests/test_cycle55_evaluate_audit.py (probe text a fake backend
# raises with; observations must never carry it). Both strings were
# replaced at source in W1 with non-credential-shaped equivalents,
# and on 2026-11-12 the owner authorized a full git history
# rewrite: both strings were replaced in all historical blobs
# (366 commits preserved; the head tree is unchanged apart from
# these comments). A full-history scan under this config now
# reports zero findings, and the Secret scan workflow is green at
# the rewritten head. Commit SHAs cited in records written before
# 2026-11-12 are pre-rewrite and historical. Any FURTHER finding
# is a genuine triage item.
#
# Third finding, closed by removal the same way (2026-11-13): a
# false positive of the same generic-api-key rule on the W3-3
# test-layer manifest — the scanner read the substring "token"
# inside a test filename and treated the next sorted manifest
# entry as a credential value. No credential existed (reproduced
# and adjudicated on a fresh clone with the pinned scanner);
# under the no-exceptions order above the file was renamed so
# the tree scans clean, and the owner authorized a second,
# surgical history rewrite that replaced only the one affected
# manifest blob (375 commits preserved; the head tree is
# unchanged). A fresh clone at the rewritten head scans zero
# findings in history and directory modes, and the Secret scan
# workflow is green there. The full record is in
# docs/STABLE_RELEASE_LEDGER.md (RR-01) and docs/SECURITY.md.
