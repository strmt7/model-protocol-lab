# Documentation site — builds docs/ with MkDocs Material in strict
# mode and publishes it through GitHub Actions
# (actions/upload-pages-artifact + actions/deploy-pages). Pages is
# configured with build_type=workflow, so this workflow is the
# publishing mechanism and the repository keeps no publishing
# branch.
#
# History: cycle 214 shipped this Actions pipeline. Cycle 222
# replaced it with a plain git push to a gh-pages branch so that no
# repo automation touched the Pages deployment API, and Pages
# served the branch (build_type=legacy). Cycle 236 (2026-11-06)
# restored the Actions pipeline on the owner's order that the
# repository keep exactly one branch (main), and the gh-pages
# branch was deleted once the workflow publish verified live.
# One consequence is stated plainly: every deploy-pages run mints
# a Deployment record in the github-pages environment. Under the
# owner's standing deployments duty, each record is deleted
# immediately after its publish is verified and the deployments
# list is re-checked empty — the same end state the branch route
# maintained, since branch publishes also produced platform-side
# records that were deleted after each publish. The migration
# steps and verification evidence live in the cycle-236 report
# (agents_out/cycle236/); the reverse migration's runbook is
# agents_out/docs_publishing/IMPLEMENTATION.md.
#
# Deliberately a separate workflow, not a ci.yml job: ci.yml's job
# count is pinned at 4 by the suite, and a docs failure must never
# block or be mistaken for the verification gate.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege default: read-only. Each job declares the Pages
# grants it needs in its own block — workflow-level write grants
# would be inherited by every job, present and future (cycle 215,
# zizmor excessive-permissions; through cycle 214 the Pages grants
# sat at this top level).
permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes the
# queue, never cancels a deployment mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      pages: write # upload-pages-artifact publishes the site artifact
      id-token: write # OIDC token for the Pages artifact attestation
    steps:
      # Pinned to SHAs (comments name the tag). Verify at
      # https://github.com/actions/checkout and
      # https://github.com/actions/setup-python before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements-docs.txt"
      - run: python -m pip install --require-hashes -r tools/requirements/pip.txt
      - run: python -m pip install --require-hashes -r requirements-docs.txt
      # NO_MKDOCS_2_WARNING silences the theme's end-of-life banner in
      # the log; it is a console notice, not a build warning, and
      # --strict already fails the build on any real warning.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      # Pinned to a SHA (comment names the tag). Verify at
      # https://github.com/actions/upload-pages-artifact before
      # bumping.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write # deploy-pages publishes the deployment
      id-token: write # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to a SHA (comment names the tag). Verify at
      # https://github.com/actions/deploy-pages before bumping.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
