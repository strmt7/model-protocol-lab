name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly regression sweep (Mondays 06:00 UTC). Scheduled runs execute on
    # the default branch only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint and typecheck (no optional deps)
    runs-on: ubuntu-latest
    steps:
      # Pinned to SHAs (comments name the tag). Verify at
      # https://github.com/actions/checkout and
      # https://github.com/actions/setup-python before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      # Deliberately WITHOUT the hf extra: mypy must pass on the optional
      # torch/transformers imports via the per-module override.
      - run: pip install -e ".[dev]"
      - run: ruff check model_protocol_lab tests examples
      - run: ruff format --check model_protocol_lab tests examples
      - run: mypy model_protocol_lab

  test:
    name: tests (Python ${{ matrix.python-version }}, with hf extra)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,hf]"
      - run: coverage run -m unittest discover -s tests -t .
      - run: coverage report --fail-under=95

  security:
    name: dependency and static security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install -U pip setuptools
      - run: pip install -e ".[dev,hf]" pip-audit bandit
      # Fails on any known vulnerability in the installed dependency set.
      # torch CPU (+cpu local tag) is invisible to pip-audit's index; its
      # CVE posture is tracked manually in docs/SECURITY.md.
      - run: pip-audit --desc
      # Static scan of the package (tests excluded: they intentionally use
      # fake secrets and subprocess for CLI testing).
      - run: bandit -r model_protocol_lab/ -q

  package:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
