name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly regression sweep (Mondays 06:00 UTC). Scheduled runs execute on
    # the default branch only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cycle 210: least-privilege default for every job. Jobs that need more
# declare their own permissions block, which replaces (never extends)
# this one — the test job keeps its actions/id-token grants, and the
# other jobs get nothing beyond contents:read.
permissions:
  contents: read

jobs:
  static:
    name: lint and typecheck (no optional deps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to SHAs (comments name the tag). Verify at
      # https://github.com/actions/checkout and
      # https://github.com/actions/setup-python before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      # Deliberately WITHOUT the hf extra: mypy must pass on the optional
      # torch/transformers imports via the per-module override.
      - run: pip install -e ".[dev]"
      - run: ruff check model_protocol_lab tests examples
      - run: ruff format --check model_protocol_lab tests examples
      - run: mypy model_protocol_lab

  test:
    name: tests (Python ${{ matrix.python-version }}, with hf extra)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Least privilege: checkout needs contents:read; the pip cache and the
    # failure-artifact upload need actions read/write; the Codecov OIDC
    # upload needs id-token:write.
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,hf]"
      # Capture the full unittest output to a file so CI-only failures are
      # diagnosable via the uploaded artifact (job logs are not
      # API-accessible). pipefail preserves unittest's exit status.
      - name: run tests (output captured)
        run: |
          set -o pipefail
          coverage run -m unittest discover -s tests -t . 2>&1 | tee "$RUNNER_TEMP/unittest-py${{ matrix.python-version }}.log"
      - run: coverage report --fail-under=95
      - name: coverage xml
        if: always()
        run: coverage xml -o coverage.xml
      # Coverage upload (owner-mandated, mirrors the codecov-action setup
      # in his other repos): OIDC tokenless upload, fails the job when
      # the upload itself errors. Pinned to SHA (comment names the tag).
      - name: upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          use_oidc: true
          name: model-protocol-lab
          fail_ci_if_error: true
      - name: upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unittest-log-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/unittest-py${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7

  security:
    name: dependency and static security audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install -U pip setuptools
      - run: pip install -e ".[dev,hf]" pip-audit bandit
      # Fails on any known vulnerability in the installed dependency set.
      # torch CPU (+cpu local tag) is invisible to pip-audit's index; its
      # CVE posture is tracked manually in docs/SECURITY.md.
      - run: pip-audit --desc
      # Static scan of the package (tests excluded: they intentionally use
      # fake secrets and subprocess for CLI testing).
      - run: bandit -r model_protocol_lab/ -q

  package:
    name: build and twine check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
