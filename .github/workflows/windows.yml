# Windows portable — Phase 1 (W3-6) proved the portable-setup
# claims on a real Windows runner; Phase 2 (RR-18) promotes the
# cell from collecting the base test layer to running it. The job
# installs the hashed dev-hf lock (the exact route the CI test job
# uses, made installable on Windows by the W3-1 platform markers),
# runs `pip check`, type-checks with native mypy (win32 typeshed —
# the W3-2 platform-capability module is what makes this pass),
# collects the W3-3 base test layer with pytest --collect-only,
# and then runs that same layer with pytest.
#
# This workflow is a layer check, NOT the gate: the full suite and
# its coverage floor stay Linux-only in ci.yml, and the run here is
# the base layer only, under pytest, without coverage or unittest
# discovery. The support matrix in docs/STABILITY_CONTRACT.md
# §1.5.1 records exactly which cells this job does and does not
# prove. The 120-minute timeout is sized from the timed local
# reference run the Phase-2 promotion requires (the base layer
# took 1,850 s on the project's throttled 1.5-CPU Linux host,
# 2026-11-23) plus the hashed install and the Phase-1 steps, with
# headroom for a first-of-kind platform run; it is a cap, not a
# target.

name: Windows portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-base:
    name: windows base layer (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "pyproject.toml"
      # The CI test job's exact hashed route (ci.yml), unchanged.
      - run: python -m pip install --require-hashes -r tools/requirements/pip.txt
      - run: pip install --require-hashes -r tools/requirements/dev-hf.txt
      - run: pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m mypy model_protocol_lab
      # Capture the collect output so a Windows-only collection
      # failure is diagnosable via the uploaded artifact (job logs
      # are not API-accessible). shell: bash (Git Bash on the runner)
      # so the layer_paths.py expansion is the same command a Linux
      # contributor runs; pipefail preserves pytest's exit status.
      # Cycle 215 pattern: the matrix value reaches the script
      # through env, never by template expansion inside the script.
      - name: collect base layer (output captured)
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -o pipefail
          python -m pytest --collect-only -q -p no:cacheprovider $(python tools/layer_paths.py --layer base) 2>&1 | tee "$RUNNER_TEMP/windows-base-collect-py$PYTHON_VERSION.log"
      # Phase 2 (RR-18): run the layer the collect step just proved
      # collectible — same discovery (the layer_paths.py expansion),
      # same shell. The layer manifest's recorded POSIX classes
      # and methods skip through their own platform guards; nothing
      # is deselected here.
      #
      # The run is CHUNKED (RR-18 follow-up, 2026-11-23): the first
      # Phase-2 run was a single -q invocation whose bare dot
      # stream named no failure, and it was interrupted at 88%
      # with no summary at all — the failures had to be recovered
      # by aligning the stream against the collect log by hand.
      # Each chunk below is its own pytest invocation whose
      # failures are named twice over: -rf prints the short
      # summary into the chunk's own log, and --junitxml writes
      # names and tracebacks to a file pytest produces itself.
      # A chunk that fails or is interrupted records status=1 and
      # the loop continues, so one bad chunk can neither hide the
      # remaining chunks' evidence nor let the step pass.
      - name: run base layer (chunked, output captured)
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          mapfile -t modules < <(python tools/layer_paths.py --layer base)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "layer_paths.py --layer base produced no modules" >&2
            exit 1
          fi
          echo "base layer: ${#modules[@]} modules"
          status=0
          chunk_size=35
          chunk=0
          for ((start = 0; start < ${#modules[@]}; start += chunk_size)); do
            chunk=$((chunk + 1))
            log="$RUNNER_TEMP/windows-base-run-py$PYTHON_VERSION-chunk-$chunk.log"
            xml="$RUNNER_TEMP/windows-base-run-py$PYTHON_VERSION-chunk-$chunk.xml"
            echo "chunk $chunk: ${modules[start]} .. ${modules[start + chunk_size - 1]:-end}"
            if python -m pytest -q -rf -p no:cacheprovider --junitxml="$xml" "${modules[@]:start:chunk_size}" >"$log" 2>&1; then
              echo "chunk $chunk: passed"
            else
              echo "chunk $chunk: FAILED (log: $log, junit: $xml)"
              status=1
            fi
          done
          exit $status
      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-base-log-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/windows-base-collect-py${{ matrix.python-version }}.log
            ${{ runner.temp }}/windows-base-run-py${{ matrix.python-version }}-chunk-*.log
            ${{ runner.temp }}/windows-base-run-py${{ matrix.python-version }}-chunk-*.xml
          if-no-files-found: warn
          retention-days: 7
