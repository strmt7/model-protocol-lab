# Windows portable — Phase 1 (W3-6): prove the portable-setup claims
# on a real Windows runner. The job installs the hashed dev-hf lock
# (the exact route the CI test job uses, made installable on Windows
# by the W3-1 platform markers), runs `pip check`, type-checks with
# native mypy (win32 typeshed — the W3-2 platform-capability module
# is what makes this pass), and collects the W3-3 base test layer
# with pytest --collect-only.
#
# This workflow is a layer check, NOT the gate: the full suite and
# its floor stay Linux-only in ci.yml, and nothing here runs the
# tests it collects. Phase 2 (running the base layer on Windows)
# is a separate promotion, gated on this job staying green; the
# support matrix in docs/STABILITY_CONTRACT.md §1.5.1 records
# exactly which cells this job does and does not prove.

name: Windows portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-base:
    name: windows base layer (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "pyproject.toml"
      # The CI test job's exact hashed route (ci.yml), unchanged.
      - run: python -m pip install --require-hashes -r tools/requirements/pip.txt
      - run: pip install --require-hashes -r tools/requirements/dev-hf.txt
      - run: pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m mypy model_protocol_lab
      # Capture the collect output so a Windows-only collection
      # failure is diagnosable via the uploaded artifact (job logs
      # are not API-accessible). shell: bash (Git Bash on the runner)
      # so the layer_paths.py expansion is the same command a Linux
      # contributor runs; pipefail preserves pytest's exit status.
      # Cycle 215 pattern: the matrix value reaches the script
      # through env, never by template expansion inside the script.
      - name: collect base layer (output captured)
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -o pipefail
          python -m pytest --collect-only -q -p no:cacheprovider $(python tools/layer_paths.py --layer base) 2>&1 | tee "$RUNNER_TEMP/windows-base-collect-py$PYTHON_VERSION.log"
      - name: upload collect log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-base-log-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/windows-base-collect-py${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7
