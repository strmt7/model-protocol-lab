# OpenSSF Scorecard (cycle 210) — the machine-readable supply-chain
# score enterprise security reviewers query. publish_results: true
# publishes the score to the OpenSSF API (public repos only); the
# README carries the resulting badge. Known honest deductions are
# dispositioned in VALIDATION.md, not hidden: branch protection
# deliberately has required reviews/status checks OFF (it would block
# the autonomous push pipeline), and there are no signed releases yet
# because the v0.1.0 tag is the owner's decision alone.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly (Mondays 08:00 UTC), offset from the ci.yml/CodeQL sweeps.
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Cycle 215 (zizmor excessive-permissions): read-only default; the
# single analysis job declares its own grants below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # OIDC token for publish_results
      contents: read # checkout
      actions: read # run metadata for the Scorecard action
    steps:
      # Pinned to SHAs (comments name the tag). Verify at
      # https://github.com/actions/checkout,
      # https://github.com/ossf/scorecard-action and
      # https://github.com/github/codeql-action before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
