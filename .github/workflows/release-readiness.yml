# Non-publishing release readiness (audit RR-06, W1).
#
# workflow_dispatch only: no tag triggers, no publish steps, no PyPI
# environment, no credentials beyond the read-only API token. The job
# checks out the supplied commit, re-runs the full quality gate there,
# and then runs tools/release_policy.py, which accepts the commit
# only if the CI run, the Secret scan run, the CodeQL run and the
# dependency/static security audit job for that exact SHA all
# completed successfully and the tree at that SHA carries the
# supplied version. The output is a readiness receipt, never a
# release: .github/workflows/release.yml remains the only publish
# path and is unchanged.
name: Release readiness

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to certify"
        required: true
        type: string
      version:
        description: "Version the release would claim (must match the tree at the SHA)"
        required: true
        type: string

# Least-privilege default: the verifier only reads workflow runs,
# jobs and file contents through the API.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  readiness:
    name: readiness gate and policy receipt
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ inputs.sha }}
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      # Pinned to SHAs (comments name the tag), matching ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install --require-hashes -r tools/requirements/pip.txt
      - run: pip install --require-hashes -r tools/requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check model_protocol_lab tests examples
      - run: ruff format --check model_protocol_lab tests examples
      - run: mypy model_protocol_lab
      - run: bandit -r model_protocol_lab/ -q
      - run: coverage run -m unittest discover -s tests -t .
      - run: coverage report --fail-under=95
      - name: Verify the exact-SHA evidence receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_policy.py --sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
