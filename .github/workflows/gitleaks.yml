# Secret scanning (cycle 210) — gitleaks over the full git history.
# Deliberately NOT the gitleaks-action: this workflow downloads the
# pinned gitleaks binary and verifies its SHA-256 against the release
# checksums before running it, so no third-party action executes in
# the job at all. The scan fails on any finding; the only allowlisted
# patterns are two verified-synthetic test fixtures, pinned by exact
# regex in .gitleaks.toml (never by path — a path allowlist would blind
# the scanner to future real secrets in those files).
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays 09:00 UTC), offset from the other sweeps.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (history scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, verified against
      # the release checksums file at cycle-210 build time.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Pinned to SHAs (comments name the tag). Verify at
      # https://github.com/actions/checkout before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks (SHA-verified)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks detect --redact --config .gitleaks.toml
