# Release pipeline — runs only when the owner pushes a version tag.
#
# Creating the tag is the owner's decision (see AGENTS.md); this workflow
# never creates one. It builds the artifacts with the pinned reproducible
# procedure (tools/release_build.py: SOURCE_DATE_EPOCH-normalized, built
# twice, identical SHA-256 required), publishes to PyPI through Trusted
# Publishing (OIDC — no long-lived PyPI token exists in CI; PEP 740
# attestations are generated by the publish action), and attaches build
# provenance attestations to the artifacts for the GitHub release.
#
# One-time owner setup on PyPI (before the first tag): register the
# project name and add a Trusted Publisher for this repository, this
# workflow file (release.yml), and the `pypi` environment. Until that
# exists the publish step fails closed and nothing is uploaded.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install "build>=1.2" "twine>=5"
      - name: Reproducible double build (hashes must match)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          # Bind the tag to the package version before anything is
          # built or uploaded: a tag vX.Y.Z whose tree carries a
          # different version fails here, not after publishing
          # (cycle 202 — before this, any v* tag published the tree's
          # version under the tag's name).
          python tools/release_build.py --source . --output dist \
            --epoch "$SOURCE_DATE_EPOCH" \
            --expect-version "${GITHUB_REF_NAME#v}"
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # Trusted Publishing (OIDC) + attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attest build provenance for the artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Create the GitHub release with the artifacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --notes "Artifacts built reproducibly from this tag
          (tools/release_build.py) and published to PyPI with PEP 740
          attestations. Verify provenance with:
          gh attestation verify <artifact> --repo strmt7/model-protocol-lab"
