# Release pipeline — runs only when the owner pushes a version tag.
#
# Creating the tag is the owner's decision (see AGENTS.md); this workflow
# never creates one. It builds the artifacts with the pinned reproducible
# procedure (tools/release_build.py: SOURCE_DATE_EPOCH-normalized, built
# twice, identical SHA-256 required), publishes to PyPI through Trusted
# Publishing (OIDC — no long-lived PyPI token exists in CI; PEP 740
# attestations are generated by the publish action), and attaches build
# provenance attestations to the artifacts for the GitHub release.
#
# One-time owner setup on PyPI (before the first tag): register the
# project name and add a Trusted Publisher for this repository, this
# workflow file (release.yml), and the `pypi` environment. Until that
# exists the publish step fails closed and nothing is uploaded.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Cycle 215 (zizmor concurrency-limits): one release run per tag,
# and a release is never cancelled mid-flight — a half-published
# release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install --require-hashes -r tools/requirements/build.txt
      - name: Derive the release epoch from the tagged commit
        # Cycle 208: the epoch is the tagged commit's timestamp
        # (tools/release_build.py's documented convention), not a
        # fixed constant — every release used to claim the same
        # 2023 epoch. The checkout of a tag points at its commit,
        # so `git log -1` reports exactly that commit.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Reproducible double build (hashes must match)
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          # Bind the tag to the package version before anything is
          # built or uploaded: a tag vX.Y.Z whose tree carries a
          # different version fails here, not after publishing
          # (cycle 202 — before this, any v* tag published the tree's
          # version under the tag's name).
          python tools/release_build.py --source . --output dist \
            --epoch "$SOURCE_DATE_EPOCH" \
            --expect-version "${GITHUB_REF_NAME#v}"
          python -m twine check dist/*
      - name: Install the wheel and smoke-test the published artifact
        # Cycle 208 (M1): the pipeline used to publish artifacts it
        # never installed or ran. The wheel is installed into a
        # fresh venv and the zero-dependency commands are run
        # against it, plus the shipped MCP server's self-test —
        # so a packaging regression that only appears after
        # installation fails here, not at a customer's install.
        # The fixture file is an input, not part of the artifact:
        # examples/ is not in the sdist, and inspect only reads
        # the file it is given.
        run: |
          python -m venv /tmp/mpl-release-smoke
          /tmp/mpl-release-smoke/bin/pip install --quiet dist/*.whl
          /tmp/mpl-release-smoke/bin/model-protocol-lab catalog
          /tmp/mpl-release-smoke/bin/model-protocol-lab inspect examples/fixtures.json
          /tmp/mpl-release-smoke/bin/model-protocol-lab-mcp --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI and GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # Trusted Publishing (OIDC) + attestations
      attestations: write # build-provenance attestations for dist/*
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Cycle 208 (S6): the publish job needs the tree to read the
      # versioned release notes; it downloads only the dist
      # artifact otherwise. Cycle 210: persist-credentials false is
      # safe here because `gh` below uses GH_TOKEN from env, not the
      # credential a checkout would persist into .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attest build provenance for the artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Create the GitHub release with the artifacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cycle 208 (S6): use the versioned release notes when the
          # tree carries them for this tag; otherwise fall back to
          # the template so an unwritten notes file never blocks
          # the release.
          NOTES_FILE="docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Artifacts built reproducibly from this tag
              (tools/release_build.py) and published to PyPI with PEP 740
              attestations. Verify provenance with:
              gh attestation verify <artifact> --repo strmt7/model-protocol-lab"
          fi
