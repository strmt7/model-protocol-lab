# Release pipeline — runs only when the owner pushes a version tag.
#
# Creating the tag is the owner's decision (see AGENTS.md); this workflow
# never creates one. Before anything is built, the readiness job runs
# the RR-06 verifier (tools/release_policy.py) against the tagged
# commit: a tag publishes only a commit whose CI, Secret scan and
# CodeQL evidence for that exact SHA completed successfully and whose
# tree carries the tag's version — any gap stops the run before the
# build starts. It builds the artifacts with the pinned reproducible
# procedure (tools/release_build.py: SOURCE_DATE_EPOCH-normalized, built
# twice, identical SHA-256 required), publishes to PyPI through Trusted
# Publishing (OIDC — no long-lived PyPI token exists in CI; PEP 740
# attestations are generated by the publish action), and attaches build
# provenance attestations to the artifacts for the GitHub release.
#
# One-time owner setup on PyPI (before the first tag): register the
# project name and add a Trusted Publisher for this repository, this
# workflow file (release.yml), and the `pypi` environment. Until that
# exists the publish step fails closed and nothing is uploaded.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Cycle 215 (zizmor concurrency-limits): one release run per tag,
# and a release is never cancelled mid-flight — a half-published
# release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: verify exact-SHA readiness receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # RR-06: exactly the least-privilege block
    # release-readiness.yml documents, held on this job (the
    # cycle-215 pattern) so the build and publish jobs inherit
    # nothing new.
    permissions:
      contents: read # checkout the tagged tree; the verifier reads its version via the API
      actions: read # the verifier reads workflow runs and jobs for the tagged SHA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # RR-06 (wired in the W8 follow-up cycle): until this step
      # accepts, nothing is built and nothing publishes — the
      # build job needs this job, and the publish job needs the
      # build. The verifier fetches the CI, Secret scan and
      # CodeQL evidence for the exact tagged commit from the
      # GitHub API and accepts only when every run completed
      # successfully, the dependency and static security audit
      # job inside the CI run succeeded, and the tree at that
      # commit carries the tag's version. Every gap rejects with
      # a named reason (exit 1); unobtainable evidence fails
      # closed (exit 2). The JSON it prints is the readiness
      # receipt the audit named; --out keeps a copy as this
      # run's release-receipt artifact.
      - name: Verify the exact-SHA readiness receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release_policy.py --sha "$GITHUB_SHA" \
            --version "${GITHUB_REF_NAME#v}" \
            --out release-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt
          path: release-receipt.json

  build:
    name: build release artifacts
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Cycle 228 (audit B-05): this job was the one workflow not
      # bootstrapping the pinned pip first — the installer's own
      # version stayed unpinned in the highest-value job.
      - run: python -m pip install --require-hashes -r tools/requirements/pip.txt
      # Cycle 228 (audit B-02): the pinned PEP 517 backend. The build
      # runs --no-isolation (tools/release_build.py), which fails
      # unless the ambient setuptools is exactly the version
      # pyproject.toml's [build-system] requires.
      - run: python -m pip install --require-hashes -r tools/requirements/pip-setuptools.txt
      - name: Install the builder
        run: python -m pip install --require-hashes -r tools/requirements/build.txt
      - name: Derive the release epoch from the tagged commit
        # Cycle 208: the epoch is the tagged commit's timestamp
        # (tools/release_build.py's documented convention), not a
        # fixed constant — every release used to claim the same
        # 2023 epoch. The checkout of a tag points at its commit,
        # so `git log -1` reports exactly that commit.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Reproducible double build (hashes must match)
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          # Bind the tag to the package version before anything is
          # built or uploaded: a tag vX.Y.Z whose tree carries a
          # different version fails here, not after publishing
          # (cycle 202 — before this, any v* tag published the tree's
          # version under the tag's name).
          python tools/release_build.py --source . --output dist \
            --epoch "$SOURCE_DATE_EPOCH" \
            --expect-version "${GITHUB_REF_NAME#v}" \
            --build-record build-record.json
          python -m twine check dist/*
      - name: Install the wheel and smoke-test the published artifact
        # Cycle 208 (M1): the pipeline used to publish artifacts it
        # never installed or ran. The wheel is installed into a
        # fresh venv and the zero-dependency commands are run
        # against it, plus the shipped MCP server's self-test —
        # so a packaging regression that only appears after
        # installation fails here, not at a customer's install.
        # W5 (RR-11): that smoke ran the venv's console scripts
        # from this checkout, and the readiness lane proved by
        # sabotage that it could not tell the artifact from the
        # tree — with nothing installed and the checkout on
        # PYTHONPATH, every command still exited 0. The smoke is
        # now tools/artifact_smoke.py: it creates its own venv,
        # scrubs the environment of every subprocess, runs from
        # an empty external directory, and asserts the imported
        # package resolves under that venv's site-packages at
        # the wheel's own version before any output is trusted.
        run: python tools/artifact_smoke.py --wheel dist/*.whl --source-tree . --result-json smoke-result.json
      # RR-12: the sdist ships the test suite minus a declared
      # checkout-only scope (tests/CHECKOUT_ONLY). The runner
      # executes the declared scope from the sdist alone — a module
      # that gains a checkout dependency without joining the
      # manifest fails here, at release time at the latest.
      - name: Verify the sdist test scope
        run: python tools/sdist_scope.py --sdist dist/*.tar.gz --source-tree . --result-json scope-result.json
      # W5-5 (RR-11 receipt): bind the readiness evidence to the
      # artifacts' hashes. The manifest records the double-build
      # record, the census result and the smoke/scope results (each
      # bound to the artifact hash it ran against) and references
      # the CycloneDX SBOM by digest; both files land in dist/ so
      # the publish job's attestation (subject-path dist/*) and the
      # GitHub release attachments cover them with the artifacts.
      - name: Emit the artifact manifest and SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          python tools/artifact_manifest.py emit --dist dist --source . \
            --commit "$GITHUB_SHA" --epoch "$SOURCE_DATE_EPOCH" \
            --build-record build-record.json \
            --smoke-result smoke-result.json \
            --scope-result scope-result.json
      # W5-6: the from-sdist rebuild under the declared conditions
      # (tarfile data-filter extraction, epoch-normalized mtimes,
      # epoch-stamped build) must reproduce the wheel byte-for-byte;
      # a metadata-only delta (zip timestamps) is named as such from
      # the manifest's per-member digests instead of passing or
      # failing opaquely.
      - name: Rebuild the wheel from the sdist
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          python tools/artifact_manifest.py rebuild-check --dist dist \
            --epoch "$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI and GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # Trusted Publishing (OIDC) + attestations
      attestations: write # build-provenance attestations for dist/*
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Cycle 208 (S6): the publish job needs the tree to read the
      # versioned release notes; it downloads only the dist
      # artifact otherwise. Cycle 210: persist-credentials false is
      # safe here because `gh` below uses GH_TOKEN from env, not the
      # credential a checkout would persist into .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attest build provenance for the artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Create the GitHub release with the artifacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cycle 208 (S6): use the versioned release notes when the
          # tree carries them for this tag; otherwise fall back to
          # the template so an unwritten notes file never blocks
          # the release.
          NOTES_FILE="docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Artifacts built reproducibly from this tag
              (tools/release_build.py) and published to PyPI with PEP 740
              attestations. Verify provenance with:
              gh attestation verify <artifact> --repo strmt7/model-protocol-lab
              The release also carries artifact-manifest.json and
              sbom.cdx.json: recompute each artifact's SHA-256, compare
              it with the manifest, then run
              python tools/artifact_manifest.py verify --dist <dir> --source <tag checkout>
              to re-check every claim the manifest makes."
          fi
