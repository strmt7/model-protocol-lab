[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-protocol-lab"
version = "0.1.0"
description = "Local conversation protocol experiments with held-out evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
maintainers = [{ name = "Stratos" }]
keywords = ["llm", "evaluation", "tokenizer", "chat-template", "experiment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.6,<3", "transformers>=4.57.1,<6", "safetensors>=0.6", "jinja2>=3.1.6"]
dev = ["ruff>=0.17.3", "mypy>=2.4.1", "coverage>=7.17.0", "hypothesis>=6.170.14", "pytest>=9.2.0"]

[project.scripts]
model-protocol-lab = "model_protocol_lab.cli:main"
model-protocol-lab-mcp = "model_protocol_lab.mcp_server:serve"

[project.urls]
Homepage = "https://github.com/strmt7/model-protocol-lab"
Repository = "https://github.com/strmt7/model-protocol-lab"
Issues = "https://github.com/strmt7/model-protocol-lab/issues"
Changelog = "https://github.com/strmt7/model-protocol-lab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["model_protocol_lab*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "S", "SIM", "BLE", "UP"]
# NOTE: BLE001 (blind except) stays enabled. The `except Exception` blocks in
# core.py/backends.py/doctor.py are deliberate sanitization boundaries: arbitrary
# backend/dependency exceptions must be converted to fixed error codes and never
# leak text. Each site carries an explicit `# noqa: BLE001` with that rationale.

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the standard unittest mechanism in tests.
# S105/S106: tests deliberately use fake secrets (e.g. SECRET) and tokenizer
#   parameter names (unk_token) that bandit's name matching flags; no real
#   credentials exist anywhere in this repo.
# S603: test_e2e.py invokes the CLI via subprocess with fixed argv lists and
#   shell disabled; no untrusted input reaches the shell.
"tests/*" = ["S101", "S105", "S106", "S603"]
# S603/S607: tools/ are developer CLIs whose purpose is running subprocesses
#   (venv creation, pip installs, the pinned ccc/Crawl4AI CLIs) with fixed argv
#   lists and shell disabled; no untrusted input reaches the shell.
"tools/*" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
[[tool.mypy.overrides]]
# The override must name the IMPORTED optional modules, not the importing file:
# this silences missing-import errors for the optional HF stack when it is not
# installed (the adapter itself stays importable without it).
module = ["torch", "transformers", "jinja2"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["model_protocol_lab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
