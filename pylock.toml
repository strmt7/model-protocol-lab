# PEP 751 lock for the DEVELOPMENT environment (the [dev] extra),
# generated 2026-10-23 with pip 26.2.1 on CPython 3.12 / Linux x86_64.
# It pins what a contributor's dev venv resolves to, with wheel hashes.
# It does not constrain library consumers (they get the pyproject
# ranges), and CI does not install from it: CI deliberately installs the
# latest ruff/bandit so new lint and security rules surface immediately
# (see the project's verification protocol). The [hf] extra is not
# locked here: hashing its wheels requires downloading the multi-GB
# CUDA stack (docs/SECURITY.md, residual risk 2).
# Refresh: pip lock -e ".[dev]" --output pylock.toml
